name: Conductellence Binding Audit
on:
  push:
    branches: [main]
    paths: ['.security/**','.github/workflows/conductellence-binding-audit.yml']
  pull_request:
    branches: [main]
    paths: ['.security/**','.github/workflows/conductellence-binding-audit.yml']
permissions: {contents: read}
jobs:
  binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .security/conductellence-runtime.py --binding-check
      - run: python3 .security/conductellence-runtime.py --selftest
      - run: python3 .security/conductellence-runtime.py --policy-unavailable-test
